services:
  postgres:
    image: postgres:17-bookworm
    container_name: omnivest_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnivest_ai_network

  redis:
    image: redis:7.4-alpine
    container_name: omnivest_ai_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_storage:/data
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    networks:
      - omnivest_ai_network

volumes:
  postgres_data:
  redis_storage:
    driver: local
networks:
  omnivest_ai_network:
    driver: bridge